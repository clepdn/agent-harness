# One file is one agent. Copy this to agents/mira.toml, chmod it to 0600, and
# fill in the values. Real agent files are ignored by git.
#
# This file covers only what the control plane owns. Everything the agent
# itself runs on — model, fallback, tools, context, discord, subagents — lives
# in the runtime TOML referenced by `config` below, in exactly the format a
# standalone `nano --config ...` run reads. See config.example.toml.

id = "mira"
name = "Mira"
home = "./data/agents/mira"

# Where this agent's tools run. `local` runs them on the server machine;
# an HTTP(S) URL points at a tool client started with `npm run start` on
# another machine.
client = "http://mira-macbook.local:3002"

# Applies to `client = "local"` only.
# workspace = "/srv/workspace"

# The worker's runtime configuration. A single path, or a list whose later
# entries deep-merge over earlier ones — share a base file across agents and
# layer each agent's differences on top.
config = ["/etc/nano/config.toml", "/etc/nano/agents/mira.toml"]

# Credentials, deep-merged over `config` last. Keep this mode 0400.
secrets = "/run/agenix/nanoSecrets"

# Worker port. Defaults to the control port plus this file's sorted position.
# port = 4301

# Environment variables for the worker process. For runtime settings that are
# genuinely environment-shaped only — anything the runtime reads from TOML
# belongs in the `config` file instead, where it cannot leak into the agent's
# own shell. Names the server manages (NANO_*, PORT, NANO_CONFIG, ...) are
# rejected here.
[settings]
NANO_DISABLE_DISCORD_TOOLS = "false"
