# Example nano config. Copy to config.toml and tweak.
# Secrets belong in secrets.toml.env, not here.
#
# Launch with:
#   nano --config /path/to/config.toml --secrets /path/to/secrets.toml.env

# ── Model presets ────────────────────────────────────────────────────────────
# Define named model configurations once, then reference them from [model],
# [fallback], [summary], and [embeddings] via `preset = "name"`.
# Secrets (api_key) are deep-merged from the secrets file into the same
# [models.<name>] table, so they don't need to be repeated here.

[models.umans]
provider = "openai"
model = "umans-glm-5.2"
base_url = "https://api.code.umans.ai/v1"
tool_choice = "required"
enable_thinking = true
thinking_effort = "low"

[models.glm_openrouter]
provider = "openrouter"
model = "zai-org/glm-4.7-flash"
base_url = ""
tool_choice = "required"
referer = ""
title = ""
n_ctx = 4096
context_margin = 256
hard_overflow_tokens = 1024
# enforce_context_limit = false

[models.gemini_embedding]
provider = "openai"
model = "google/gemini-embedding-2-preview"
base_url = "https://openrouter.ai/api/v1"
dimensions = 3072
referer = ""
title = ""

# ── Remote bridge client ─────────────────────────────────────────────────────
# When a model preset sets `bridge = true`, nano routes that model through a
# bridge reachable at llm_bridge_url as an OpenAI-compatible endpoint, using
# llm_bridge_api_key for auth. Use this to talk to a bridge running on another
# host. nano does not bundle or start a local bridge.
# llm_bridge_url = "https://bridge.example.com/v1"
#
# The auth key can be supplied three ways (checked in this order):
#   1. llm_bridge_api_key inline (belongs in secrets, not here)
#   2. llm_bridge_api_key deep-merged from the secrets file
#   3. llm_bridge_api_key_file - path to a file whose contents are the key.
#      Intended for the NixOS/agenix "path to a secret" pattern; the path
#      itself is not secret, so it can live in this config. If the file is set
#      but unreadable, nano fails to start rather than running unauthenticated.
# llm_bridge_api_key_file = "/run/agenix/bridge-client-key"

[server]
port = 3000
# Address to bind the HTTP server and web UI. Use "0.0.0.0" to listen on all
# IPv4 interfaces. Keep the loopback default unless remote access is intended.
listen = "127.0.0.1"

[agent]
# Display name used in summarizer prompt and grounding context.
name = "nano"
# Set to "local" to skip the primary model and route everything through the fallback.
env = "default"
# Boredom wake: if > 0, wake the agent after this many minutes of inactivity.
# Applies after startup, while waiting for events, and after ending a session.
# Waiting sessions resume their context; resting sessions start a new model loop.
# Any real wake (DM, heartbeat, etc.) resets the timer. 0 disables.
# boredom_wake_min = 0
# Git upstream check: when true, runs `git fetch` on every file read/write
# and nags the agent if the remote has changed. Throttled to 10 min per repo.
# git_upstream_nag = false

# Optional: route shell tools through a Docker container instead of the local shell.
# Set both to enable. Mutually exclusive with [ssh].
[container]
name = ""
user = ""

# Optional: route shell tools through SSH instead. Mutually exclusive with [container].
[ssh]
target = ""
identity = ""

[model]
# Reference a preset defined under [models.<name>], or set fields directly.
preset = "umans"
# Any field here overrides the preset.
# Minutes of session idle before a mid-session compaction pass runs. 0 = off.
# Per-model/preset because it depends on the model's context + cache behavior.
# Set it on a [models.<name>] preset to have it swap with the model.
# idle_compaction_minutes = 45
#
# ── Per-model context behavior (moved here from [context]) ──────────────────
# These are really functions of the model — its context window, its price
# cliffs, whether it does prompt caching — so they live on the preset and swap
# with the model at runtime. Setting them under [context] still works as a
# back-compat fallback. Set them on a [models.<name>] preset to make them swap.
#
# Which compaction pipeline runs at the trigger:
#   companion | context-full | snapcompact | remote | off   (default companion)
# compaction_strategy = "companion"
# Prompt-token count that fires compaction (the price/limit cliff to defend):
# compact_trigger_tokens = 90000
# Preserve compressed-away specifics out-of-band (deep archive layer):
# deep_archive = true
# Avoid history mutations that bust the prompt cache. When true, disables all
# LLM compaction and requires a rest before switching models. (Renamed from
# preserve_prompt_cache; the old key is still accepted.)
# respect_prompt_cache = true

[fallback]
# Used when the primary endpoint is unreachable or rate-limited (429/5xx).
preset = "glm_openrouter"

[summary]
# Optional dedicated summarizer model. Leave empty to reuse primary/fallback.
preset = "glm_openrouter"

[embeddings]
# Reference a preset, or set fields directly.
preset = "gemini_embedding"

[context]
compact_target_tokens = 65000
compact_recent_messages = 80
compact_chunk_messages = 32
compact_summary_max_chars = 16000
# NOTE: these moved to [model] (per-model/preset options now, since they're
# really about the model's context/cache behavior). Setting them here still
# works as a back-compat fallback, but prefer the preset:
#   idle_compaction_minutes  (default 0)
#   compaction_strategy      (default "companion")
#   compact_trigger_tokens   (default 90000)
#   deep_archive             (default true)
#   respect_prompt_cache     (default true; was preserve_prompt_cache)
# Proactive tool-result compaction requires all three thresholds below.
tool_result_compaction_min_age_turns = 5
tool_result_compaction_min_chars = 2000
# Percentage of the active generation model's context window that must be used.
tool_result_compaction_min_context_percent = 50

[runner]
# Hard cap on assistant turns in a single wake cycle.
max_turns = 120
# Stop if the same assistant tool call + result pattern repeats.
max_identical_tool_turns = 6

[image_tool]
# Max bytes accepted before rejecting an image attachment.
max_bytes = 150000
# Absolute image root exposed to the agent. Defaults based on container/ssh mode.
root = ""

[context_images]
# Attach local Markdown images when memories, soul.md, or skills enter vision context.
markdown = true
# PNG, JPEG, GIF, and WebP files must stay within the agent home, including symlinks.
max_bytes = 5000000
max_per_message = 8

[discord]
# Include each author's avatar once while their image remains in context.
include_user_avatars = false
# Include the bot's own avatar whenever a fresh context starts.
include_bot_avatar = false
gateway_enabled = true
gateway_trace = false
gateway_raw_fallback = true
gateway_raw_fallback_all = false
# Discord user ID of the owner. Only this user can use slash commands.
# Find your ID: enable Developer Mode in Discord settings, right-click your name, Copy ID.
owner_id = ""
# Enable owner-only /join, /leave, and /voice commands. Uses llm_bridge_url/key.
voice_enabled = false
# Codex-plan realtime model and default voice used for calls.
voice_model = "gpt-live-1-codex"
voice = "juniper"
# Channel ids scanned by discord_scan when no channel_ids arg is passed.
scan_channel_ids = []
wake_on_event = false
wake_on_dm = true
batch_interval_ms = 60000
batch_only_configured = true
pending_auto_seen_minutes = 10
batch_scan = true
batch_max_messages = 40
rest_max_attempts = 3
rest_retry_base_ms = 1000
# Auto-detected from the gateway READY payload if left blank.
bot_user_id = ""

[metrics]
retention_days = 3

# ── Tool filtering (main agent) ───────────────────────────────────────────────
# Control which tools the main agent can use.
# - enabled_tools: if empty (default), ALL tools are enabled.
#   If non-empty, only the listed tools are available.
# - blacklisted_tools: always removed from the available set, regardless of
#   enabled_tools.
#
# [tools]
# enabled_tools = ["shell", "read_file", "memory_search"]
# blacklisted_tools = ["rest"]

# ── Subagents ─────────────────────────────────────────────────────────────────
# Define named subagents the main agent can spawn via the `subagent` tool.
# Each [[subagents]] entry creates a new subagent with its own system prompt,
# tool set, and turn limit. Subagents run a simplified loop — no event waiting,
# no compaction, no Discord access, no nesting.
#
# [[subagents]]
# name = "researcher"
# model = ""                    # blank = inherit main agent's model
# system_prompt = "You are a research assistant. Be thorough and cite sources."
# enabled_tools = ["shell", "read_file", "memory_search"]   # blank = all (minus auto-blacklisted)
# blacklisted_tools = ["edit_file"]                            # additional exclusions
# max_turns = 30
#
# [[subagents]]
# name = "writer"
# model = ""
# system_prompt = "You are a technical writer. Produce clean, concise prose."
# enabled_tools = []
# blacklisted_tools = []
# max_turns = 20

# Prometheus metrics exporter
# [prometheus]
# port = 9100

# Web search via Exa (https://exa.ai). When exa_api_key is present and non-empty
# the web_search tool is registered; otherwise it's omitted entirely. The key
# belongs in the secrets file, not here.
# [web_search]
# exa_api_key = "exa_..."
